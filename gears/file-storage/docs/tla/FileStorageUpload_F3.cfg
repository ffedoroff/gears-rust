\* Finding F3 (I9_SavedDeleteRespectsCAS_SpecificEtag): delete_file's missing
\* recheck loses a concurrent bind. Restricted to a CONCRETE etag
\* (dStar = FALSE, dExpect # NoVer) so the counterexample is specifically
\* "client read etag E_v1 for a file bound to v1, the check passed, a
\* concurrent rebind retargeted the file to v2, then the unconditional wipe
\* destroyed v2's binding" -- not the `If-Match: *` shape (which is not a
\* bug: `*` means "delete whatever is there"). See states-upload.md's F3
\* entry for the full trace and the verified fix (recheck content[f] inside
\* the same step as the wipe). `FixDeleteIfMatchInTx = FALSE` reverts the
\* shipped fix to reproduce the original bug; `FixDownloadHashCheck` is
\* unrelated to this finding, left at its current-code value.
