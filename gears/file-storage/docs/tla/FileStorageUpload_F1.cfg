\* Finding F1 (I5_ReadExactOrMiss): a stale-but-unexpired PUT token can
\* publish NEW bytes at a version id's path after that version's row AND
\* backend blob were both legitimately deleted, and a download ticket issued
\* before the delete then observes those new bytes instead of a miss -- see
\* states-upload.md's F1/U.4' entry. `FixDownloadHashCheck = FALSE` reverts
\* the shipped fix (the GET claims' `content_sha256` check) to reproduce the
\* original bug; `FixDeleteIfMatchInTx` is unrelated to this finding, left
\* at its current-code value.
SPECIFICATION Spec
CONSTANTS
    Files = {f1}
    VerIds = {v1, v2}
    Values = {a, b}
    IdemKeys = {k1}
    Clients = {c1}
    Deleters = {d1}
    Readers = {r1}
    MaxTick = 1
    PendingGrace = 0
    RetentionGrace = 0
    FixDownloadHashCheck = FALSE
    FixDeleteIfMatchInTx = TRUE
INVARIANTS
    I5_ReadExactOrMiss
