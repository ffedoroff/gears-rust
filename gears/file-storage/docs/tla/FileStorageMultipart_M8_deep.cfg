\* Finding M8, deep shape (Discrepancy #2): a completer's own
\* backend.complete_multipart call (M.4.8.5) already physically succeeded --
\* the final object genuinely, completely exists on the backend -- but the
\* session is reclaimed (sweep or a user's own DELETE) before that
\* completer's finalize_multipart_version transaction ever commits. Unlike
\* the shallow shape, this has NO operational mitigation at all: the
\* backend-side multipart handle has already been consumed by the
\* successful assembly, so there is no code path anywhere that would ever
\* target the finished object itself for cleanup. NativeBackend = TRUE (the
\* shipped backends) so the witness is not an artifact of the hypothetical
\* offset-object path. INVARIANT `M8_DeepOrphan_NotReachable` isolates this
\* shape alone, at rest -- a plain M8_NoPermanentOrphan search always finds
\* the shallower shape first. See states-multipart.md's "M8 orphan
\* classification". `FixDeleteAssembledObject = FALSE` reverts the shipped
\* fix (neither cleanup site exists) to reproduce the original bug;
\* `FixCloseFromInProgress` is unrelated to this finding, left at its
\* current-code value.
SPECIFICATION Spec
CONSTANTS
    Parts = {p1, p2}
    Values = {a, b}
    Completers = {c1, c2}
    FenceSamePart = FALSE
    NativeBackend = TRUE
    SessionExpiresAt = 2
    LeaseDuration = 1
    MaxTick = 3
    MaxWrites = 3
    FixCloseFromInProgress = TRUE
    FixDeleteAssembledObject = FALSE
INVARIANTS
    M8_DeepOrphan_NotReachable
