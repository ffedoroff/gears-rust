\* Finding (G.14): a timeout's own cleanup of its OWN never-committed write
\* (G.14's "created_by_us => delete target" branch) can still destroy
\* something that became live through an unrelated G.12-family chain of
\* events while that write sat unconfirmed -- see states-migration.md,
\* "Second finding: G.14's clean up my own write branch has the same gap
\* as G.12". G1 is deliberately EXCLUDED here (it is already known-violated
\* by the G.12 finding and would just re-trip first, hiding this one) --
\* this config isolates G4 alone to show the SEPARATE defect.
\* `FixLeaseThroughCleanup = FALSE` reverts the shipped fix to reproduce the
\* original bug (the SAME fix closes this too when TRUE -- see
\* `FileStorageMigration.cfg`). Exhaustive witness run: depth 17.
SPECIFICATION Spec
CONSTANTS
    Migrators = {w1, w2}
    Deleters = {d1}
    Readers = {r1}
    Backends = {b1, b2}
    ExternalActor = FALSE
    MaxGen = 4
    FixLeaseThroughCleanup = FALSE
CONSTRAINT GenConstraint
SYMMETRY Symm
INVARIANTS
    TypeOK
    G4_TailDeleteSafe
