\* Finding M7 (Discrepancy #3): a session whose embedded finalize CAS won
\* (versionAvailable becomes, and stays, TRUE) but whose own session-close
\* CAS lost (state is left "in_progress") is later picked up by the sweep
\* or by the user's own DELETE as if it were an ordinary abandoned upload --
\* the row genuinely, truthfully reads in_progress. No bytes/binding are
\* destroyed; the session's own state column permanently disagrees with
\* reality ("aborted" while its version is live, bound content). Minimal
\* trace needs a lease takeover (hence NativeBackend = TRUE's native etag
\* check is what makes the ORIGINAL completer's late, resumed assembly
\* still succeed after a takeover failed it). See states-multipart.md's M7
\* entry and "Shortest M7 trace". `FixCloseFromInProgress = FALSE` reverts
\* the shipped fix (the embedded session-close CAS now also matching
\* `state = "in_progress"`) to reproduce the original bug;
\* `FixDeleteAssembledObject` is unrelated to this finding (it only changes
\* what `backendObjectExists`/`deepCleanupAttempted` do, neither of which
\* `M7_AbortCompleteExclusive` reads), left at its current-code value.
SPECIFICATION Spec
CONSTANTS
    Parts = {p1, p2}
    Values = {a}
    Completers = {c1, c2}
    FenceSamePart = FALSE
    NativeBackend = TRUE
    SessionExpiresAt = 3
    LeaseDuration = 1
    MaxTick = 2
    MaxWrites = 3
    FixCloseFromInProgress = FALSE
    FixDeleteAssembledObject = TRUE
INVARIANTS
    M7_AbortCompleteExclusive
