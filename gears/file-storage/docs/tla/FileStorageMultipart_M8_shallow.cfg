\* Finding M8, shallow shape: backend.abort_multipart is purely best-effort
\* with no retry anywhere in the system -- a session reclaimed (user abort
\* or sweep) before any completer ever assembled anything leaves the
\* sidecar's own physical per-part write(s) behind forever once that one
\* best-effort discard call happens to fail. Partially mitigated
\* OPERATIONALLY (not by this gear's own code) by a real S3-style bucket's
\* "abort incomplete multipart uploads after N days" lifecycle rule. See
\* states-multipart.md's M8 entry ("shallow"). Still an open issue,
\* independent of both `FixCloseFromInProgress` and `FixDeleteAssembledObject`
\* (this shape never reaches `backendObjectExists = TRUE` at all -- the
\* session is reclaimed before any completer assembles anything -- so
\* neither fix's cleanup logic is ever even reached); both left at their
\* current-code (TRUE) value.
SPECIFICATION Spec
CONSTANTS
    Parts = {p1, p2}
    Values = {a, b}
    Completers = {c1, c2}
    FenceSamePart = FALSE
    NativeBackend = FALSE
    SessionExpiresAt = 2
    LeaseDuration = 1
    MaxTick = 3
    MaxWrites = 3
    FixCloseFromInProgress = TRUE
    FixDeleteAssembledObject = TRUE
INVARIANTS
    M8_NoPermanentOrphan
