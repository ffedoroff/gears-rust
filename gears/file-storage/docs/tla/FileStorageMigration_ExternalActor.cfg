\* Finding (#5013): with ExternalActor = TRUE, something outside the gear's
\* own coordination (direct backend-console surgery, another tool sharing
\* the path namespace) can delete/overwrite the destination object in the
\* window the lease does not cover -- G1_NoDanglingPointer and
\* G5_ReadExactOrMiss are EXPECTED witnesses here (known issue #5013, not a
\* new finding), same root cause for both -- independent of
\* `FixLeaseThroughCleanup` (an external actor acts outside the gear's own
\* lease coordination entirely), so this runs with the fix TRUE, matching
\* the current shipped code.
SPECIFICATION Spec
CONSTANTS
    Migrators = {w1, w2}
    Deleters = {d1}
    Readers = {r1}
    Backends = {b1, b2}
    ExternalActor = TRUE
    MaxGen = 4
    FixLeaseThroughCleanup = TRUE
CONSTRAINT GenConstraint
INVARIANTS
    TypeOK
    G1_NoDanglingPointer
