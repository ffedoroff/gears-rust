\* Finding F2 (I4_NoPermanentOrphan): in a fully quiesced state, a blob can
\* survive with no row referencing it -- a best-effort blob delete (D/S) is
\* free to "fail" in the model, after which nothing ever revisits that path.
\* Model-checked confirmation of the documented P2 gap ("Backend
\* blob-without-row reconciliation... deferred to P3",
\* concurrency-and-failure-model.md Sec. 5), not a new bug.
SPECIFICATION Spec
CONSTANTS
    Files = {f1}
    VerIds = {v1, v2}
    Values = {a, b}
    IdemKeys = {k1}
    Clients = {c1}
    Deleters = {d1}
    Readers = {r1}
    MaxTick = 1
    PendingGrace = 0
    RetentionGrace = 0
    FixDownloadHashCheck = TRUE
    FixDeleteIfMatchInTx = TRUE
INVARIANTS
    I4_NoPermanentOrphan
