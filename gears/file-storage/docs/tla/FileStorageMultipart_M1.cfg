\* Finding M1 (#5103): once a version is Available, the persisted manifest
\* can disagree with what the backend physically assembled. Reachable with
\* NativeBackend = FALSE (the hypothetical, currently-unreachable
\* offset-object path -- Discrepancy #1) regardless of FenceSamePart: a
\* physical re-write whose OWN report is dropped leaves an earlier report's
\* now-stale value in the DB row, and nothing at assembly time cross-checks
\* it against the physical register (only NativeBackend = TRUE's S3-style
\* per-part ETag check does that, and it is a property of the backend, not
\* of report_part). See states-multipart.md's M1 entry.
SPECIFICATION Spec
CONSTANTS
    Parts = {p1, p2}
    Values = {a, b}
    Completers = {c1, c2}
    FenceSamePart = FALSE
    NativeBackend = FALSE
    SessionExpiresAt = 2
    LeaseDuration = 1
    MaxTick = 3
    MaxWrites = 3
    FixCloseFromInProgress = TRUE
    FixDeleteAssembledObject = TRUE
INVARIANTS
    M1_ManifestMatchesBytes
