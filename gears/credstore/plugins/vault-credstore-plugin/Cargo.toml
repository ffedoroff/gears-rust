[package]
name = "cf-gears-vault-credstore-plugin"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CredStore plugin storing secret values in HashiCorp Vault / OpenBao (KV v2)"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
metadata.docs.rs.all-features = true

[lib]
name = "vault_credstore_plugin"

[lints]
workspace = true

[dependencies]
# Local dependencies
credstore-sdk = { package = "cf-gears-credstore-sdk", version = "0.3.0", path = "../../credstore-sdk" }
types-registry-sdk = { package = "cf-gears-types-registry-sdk", version = "0.3.8", path = "../../../system/types-registry/types-registry-sdk" }
types-registry = { workspace = true }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-security = { workspace = true }

# Async runtime
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "fs"] }

# Data structures (`v4`: random jitter of the retry backoff)
uuid = { workspace = true, features = ["v4"] }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP client for the Vault / OpenBao KV v2 REST API
reqwest = { workspace = true }

# Value encoding for the KV v2 "value" field
base64 = { workspace = true }

# Logging
tracing = { workspace = true }

# Required by toolkit::gear macro
inventory = { workspace = true }

[dev-dependencies]
# The same SDK as above, plus the plugin conformance suite
credstore-sdk = { package = "cf-gears-credstore-sdk", version = "0.3.0", path = "../../credstore-sdk", features = ["conformance"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "fs", "sync"] }
serde-saphyr = { workspace = true }
httpmock = { workspace = true }
temp-env = { workspace = true }
tempfile = { workspace = true }
# Docker-backed integration tests (`#[ignore]`, run by hand; see docs/TESTING.md)
testcontainers = { workspace = true }
# The Vault image and its pinned tag; never `GenericImage::new` in a test
# (`cargo xtask check-test-container-pins`).
test-containers = { workspace = true }
