[package]
name = "cf-gears-credstore-value-migration"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "One-off operator tool moving CredStore values into the immutable-versions store (ADR-0006)"
repository.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears"]
metadata.docs.rs.all-features = true

[lib]
name = "credstore_value_migration"

[lints]
workspace = true

[dependencies]
# The NEW store contract (`CredStorePluginClientV2`).
credstore-sdk = { workspace = true }
# The gear, for its migration list (the tool applies the gear's own migrations through
# the platform runner) and the constants the `m0002` guard shares with the tool.
credstore = { workspace = true }
toolkit-security = { workspace = true }
# Platform migration runner and the `Db` handle it takes; Postgres and SQLite drivers
# (with the workspace TLS stack) for `sea-orm`, which the tool uses with raw statements.
toolkit-db = { workspace = true, features = ["pg", "sqlite"] }
sea-orm = { workspace = true }

# Fence-key HMAC (AWS-LC; the workspace bans the pure-Rust `sha2`/`hmac`).
aws-lc-rs = { workspace = true }

async-trait = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["env"] }

[dev-dependencies]
toolkit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
# Docker-backed manual tests (`#[ignore]`, never run in CI): a PostgreSQL container from the
# workspace's pinned tag.
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
test-containers = { workspace = true }
