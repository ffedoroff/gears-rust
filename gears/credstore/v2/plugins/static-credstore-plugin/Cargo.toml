[package]
name = "cf-gears-static-credstore-plugin-v2"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CredStore v2 plugin with static secret mapping for development and testing (temporary, assembled over several PRs)"
repository.workspace = true
keywords = ["constructorfabric", "cf-gears"]
metadata.docs.rs.all-features = true

[lib]
name = "static_credstore_plugin_v2"

[lints]
workspace = true

[dependencies]
# Local dependencies
# Aliased so the plugin keeps `use credstore_sdk::…` while depending on the v2 SDK package.
credstore-sdk = { package = "cf-gears-credstore-v2-sdk", version = "0.1.0", path = "../../credstore-sdk" }
types-registry-sdk = { workspace = true }
types-registry = { workspace = true }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-security = { workspace = true }

# Async runtime
async-trait = { workspace = true }

# Data structures
uuid = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }

# Logging
tracing = { workspace = true }

# Required by toolkit::gear macro
inventory = { workspace = true }

[dev-dependencies]
# The same SDK as above, plus the plugin conformance suite
credstore-sdk = { package = "cf-gears-credstore-v2-sdk", version = "0.1.0", path = "../../credstore-sdk", features = ["conformance"] }
tokio = { workspace = true, features = ["rt", "macros"] }
serde-saphyr = { workspace = true }
