[package]
name = "cf-gears-credstore-sdk"
description = "SDK for credstore gear: API traits, models, and error definitions"
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["constructorfabric", "cf-gears", "cf-gears-system"]
categories = ["security"]
metadata.docs.rs.all-features = true

[lib]
name = "credstore_sdk"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
schemars = { workspace = true }

# GTS types
gts = { workspace = true }
gts-macros = { workspace = true }
toolkit-gts = { workspace = true }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-security = { workspace = true }
toolkit-odata = { workspace = true }

# Domain types owned by tenant-resolver
tenant-resolver-sdk = { workspace = true }

# Plugin conformance suite (`conformance` feature): concurrent calls, skip notices
futures-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[features]
# Centralized `CredStoreClientV1` test double for downstream gears' tests.
test-util = []
# Reusable conformance suite for `CredStorePluginClientV2` implementations
# (`credstore_sdk::conformance`). Enable it in a plugin's dev-dependencies; the
# generated tests need `tokio` with `rt` and `macros` there too.
conformance = ["dep:futures-util", "dep:tracing", "uuid/v4"]
