components:
  schemas:
    CreateGroupDto:
      type: object
      description: REST DTO for creating a new resource group.
      required:
      - type
      - name
      properties:
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: Optional caller-supplied ID. If omitted, the server generates a UUID.
        metadata:
          description: Type-specific metadata.
        name:
          type: string
          description: Display name (1..255 characters).
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Parent group ID (null for root groups).
        tenant_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Optional target tenant for the created group (VHP-2162).

            If omitted, the tenant scope is derived from the caller's own
            `SecurityContext` -- today's unchanged default behavior. If present
            and different from the caller's own tenant, the create succeeds only
            when the caller's `create`-action `AccessScope` actually covers the
            target tenant (platform-admin / onboarding use case); otherwise the
            request is rejected as though the target tenant did not exist.
            Rejected as a contradiction for tenant-typed groups: their effective
            tenant is always `group.id`.
        type:
          type: string
          description: GTS chained type path. Must have prefix `gts.cf.core.rg.type.v1~`.
    CreateTypeDto:
      type: object
      description: REST DTO for creating a new GTS type.
      required:
      - code
      - can_be_root
      properties:
        allowed_membership_types:
          type: array
          items:
            type: string
          description: GTS type paths of allowed membership resource types.
        allowed_parent_types:
          type: array
          items:
            type: string
          description: GTS type paths of allowed parent types.
        can_be_root:
          type: boolean
          description: Whether groups of this type can be root nodes.
        code:
          type: string
          description: |-
            GTS type path. Must have prefix `gts.cf.core.rg.type.v1~`.

            Whether the type creates a new tenant scope is derived from the code:
            any path starting with the tenant RG type prefix is a tenant type.
        metadata_schema:
          description: Optional JSON Schema for instance metadata.
    GroupDto:
      type: object
      description: |-
        REST DTO for resource group representation.

        Group responses do NOT include `created_at`/`updated_at` (per DESIGN).
      required:
      - id
      - type
      - name
      - hierarchy
      properties:
        hierarchy:
          $ref: '#/components/schemas/HierarchyDto'
          description: Hierarchy context.
        id:
          type: string
          format: uuid
          description: Group identifier.
        metadata:
          description: Type-specific metadata.
        name:
          type: string
          description: Display name.
        type:
          type: string
          description: GTS chained type path.
    GroupWithDepthDto:
      type: object
      description: REST DTO for resource group with depth (hierarchy queries).
      required:
      - id
      - type
      - name
      - hierarchy
      properties:
        hierarchy:
          $ref: '#/components/schemas/HierarchyWithDepthDto'
          description: Hierarchy context with depth.
        id:
          type: string
          format: uuid
          description: Group identifier.
        metadata:
          description: Type-specific metadata.
        name:
          type: string
          description: Display name.
        type:
          type: string
          description: GTS chained type path.
    HierarchyDto:
      type: object
      description: REST DTO for hierarchy context in group responses.
      required:
      - parent_id
      - tenant_id
      properties:
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Parent group ID (null for root groups).
        tenant_id:
          type: string
          format: uuid
          description: Tenant scope.
    HierarchyWithDepthDto:
      type: object
      description: REST DTO for hierarchy context with depth in group responses.
      required:
      - parent_id
      - tenant_id
      - depth
      properties:
        depth:
          type: integer
          format: int32
          description: Relative distance from reference group.
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Parent group ID (null for root groups).
        tenant_id:
          type: string
          format: uuid
          description: Tenant scope.
    MembershipDto:
      type: object
      description: |-
        REST DTO for membership representation.

        Membership responses do NOT include `tenant_id` (derived from group).
      required:
      - group_id
      - resource_type
      - resource_id
      properties:
        group_id:
          type: string
          format: uuid
          description: Group identifier.
        resource_id:
          type: string
          description: Resource identifier.
        resource_type:
          type: string
          description: GTS type path of the resource type.
    PageInfo:
      type: object
      required:
      - limit
      properties:
        limit:
          type: integer
          format: int64
          minimum: 0
        next_cursor:
          type:
          - string
          - 'null'
        prev_cursor:
          type:
          - string
          - 'null'
    Page_GroupDto:
      type: object
      required:
      - items
      - page_info
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupDto'
        page_info:
          $ref: '#/components/schemas/PageInfo'
    Page_GroupWithDepthDto:
      type: object
      required:
      - items
      - page_info
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupWithDepthDto'
        page_info:
          $ref: '#/components/schemas/PageInfo'
    Page_MembershipDto:
      type: object
      required:
      - items
      - page_info
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MembershipDto'
        page_info:
          $ref: '#/components/schemas/PageInfo'
    Page_TypeDto:
      type: object
      required:
      - items
      - page_info
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TypeDto'
        page_info:
          $ref: '#/components/schemas/PageInfo'
    Problem:
      type: object
      description: RFC 9457 problem+json. `context` varies by error category.
      required:
      - type
      - title
      - status
      - detail
      - context
      properties:
        context:
          type: object
        detail:
          type: string
        instance:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        trace_id:
          type: string
        type:
          type: string
    TypeDto:
      type: object
      description: REST DTO for GTS type representation.
      required:
      - code
      - can_be_root
      - allowed_parent_types
      - allowed_membership_types
      properties:
        allowed_membership_types:
          type: array
          items:
            type: string
          description: GTS type paths of allowed membership resource types
        allowed_parent_types:
          type: array
          items:
            type: string
          description: GTS type paths of allowed parent types
        can_be_root:
          type: boolean
          description: Whether groups of this type can be root nodes
        code:
          type: string
          description: GTS type path
        metadata_schema:
          description: Optional JSON Schema for instance metadata
    UpdateGroupDto:
      type: object
      description: |-
        REST DTO for updating a resource group (full replacement via PUT).

        **The group's GTS type is immutable after creation.** The payload
        deliberately does not carry a `type` field — to change a group's type,
        delete the existing group and create a new one. See the SDK
        `UpdateGroupRequest` doc for the full rationale.

        Every replaceable field is **required** so an omitted field cannot be
        confused with "preserve previous value". Nullable fields (`parent_id`,
        `metadata`) must be sent explicitly as `null` to clear them — for
        example, moving a group to root requires `"parent_id": null`, not an
        omitted key.
      required:
      - name
      - parent_id
      - metadata
      properties:
        metadata:
          description: Type-specific metadata (`null` to clear).
        name:
          type: string
          description: Display name (1..255 characters).
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Parent group ID (`null` for root groups).
    UpdateTypeDto:
      type: object
      description: |-
        REST DTO for updating a GTS type (full replacement via PUT).

        Every replaceable field is **required** so an omitted field cannot be
        confused with "preserve previous value". Nullable fields
        (`metadata_schema`) must be sent explicitly as `null` to clear them.
      required:
      - can_be_root
      - allowed_parent_types
      - allowed_membership_types
      - metadata_schema
      properties:
        allowed_membership_types:
          type: array
          items:
            type: string
          description: GTS type paths of allowed membership resource types.
        allowed_parent_types:
          type: array
          items:
            type: string
          description: GTS type paths of allowed parent types.
        can_be_root:
          type: boolean
          description: Whether groups of this type can be root nodes.
        metadata_schema:
          description: JSON Schema for instance metadata (`null` to clear).
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
