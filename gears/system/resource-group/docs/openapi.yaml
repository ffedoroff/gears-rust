      security:
      - bearerAuth: []
      summary: Delete GTS type
      tags:
      - Resource Group Types
    get:
      description: Retrieve a specific GTS type definition by its GTS type path
      operationId: resource_group.get_type
      parameters:
      - description: GTS type path
        in: path
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypeDto'
          description: Type found
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Get GTS type by code
      tags:
      - Resource Group Types
    put:
      description: Update a GTS resource group type definition (full replacement)
      operationId: resource_group.update_type
      parameters:
      - description: GTS type path
        in: path
        name: code
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTypeDto'
        description: Type update data
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypeDto'
          description: Updated type
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Bad Request
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Not Found
        '409':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Conflict
        '500':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Update GTS type
      tags:
      - Resource Group Types
components:
  schemas:
    CreateGroupDto:
      description: REST DTO for creating a new resource group.
      properties:
        id:
          description: Optional caller-supplied ID. If omitted, the server generates a UUID.
          format: uuid
          type:
          - string
          - 'null'
        metadata:
          description: Type-specific metadata.
        name:
          description: Display name (1..255 characters).
          type: string
        parent_id:
          description: Parent group ID (null for root groups).
          format: uuid
          type:
          - string
          - 'null'
        tenant_id:
          description: |-
            Optional target tenant for the created group (VHP-2162).

            If omitted, the tenant scope is derived from the caller's own
            `SecurityContext` -- today's unchanged default behavior. If present
            and different from the caller's own tenant, the create succeeds only
            when the caller's `create`-action `AccessScope` actually covers the
            target tenant (platform-admin / onboarding use case); otherwise the
            request is rejected as though the target tenant did not exist.
            Rejected as a contradiction for tenant-typed groups: their effective
            tenant is always `group.id`.
          format: uuid
          type:
          - string
          - 'null'
        type:
          description: GTS chained type path. Must have prefix `gts.cf.core.rg.type.v1~`.
          type: string
      required:
      - type
      - name
      type: object
    CreateTypeDto:
      description: REST DTO for creating a new GTS type.
      properties:
        allowed_membership_types:
          description: GTS type paths of allowed membership resource types.
          items:
            type: string
          type: array
        allowed_parent_types:
          description: GTS type paths of allowed parent types.
          items:
            type: string
          type: array
        can_be_root:
          description: Whether groups of this type can be root nodes.
          type: boolean
        code:
          description: |-
            GTS type path. Must have prefix `gts.cf.core.rg.type.v1~`.

            Whether the type creates a new tenant scope is derived from the code:
            any path starting with the tenant RG type prefix is a tenant type.
          type: string
        metadata_schema:
          description: Optional JSON Schema for instance metadata.
      required:
      - code
      - can_be_root
      type: object
    GroupDto:
      description: |-
        REST DTO for resource group representation.

        Group responses do NOT include `created_at`/`updated_at` (per DESIGN).
      properties:
        hierarchy:
          $ref: '#/components/schemas/HierarchyDto'
          description: Hierarchy context.
        id:
          description: Group identifier.
          format: uuid
          type: string
        metadata:
          description: Type-specific metadata.
        name:
          description: Display name.
          type: string
        type:
          description: GTS chained type path.
          type: string
      required:
      - id
      - type
      - name
      - hierarchy
      type: object
    GroupWithDepthDto:
      description: REST DTO for resource group with depth (hierarchy queries).
      properties:
        hierarchy:
          $ref: '#/components/schemas/HierarchyWithDepthDto'
          description: Hierarchy context with depth.
        id:
          description: Group identifier.
          format: uuid
          type: string
        metadata:
          description: Type-specific metadata.
        name:
          description: Display name.
          type: string
        type:
          description: GTS chained type path.
          type: string
      required:
      - id
      - type
      - name
      - hierarchy
      type: object
    HierarchyDto:
      description: REST DTO for hierarchy context in group responses.
      properties:
        parent_id:
          description: Parent group ID (null for root groups).
          format: uuid
          type:
          - string
          - 'null'
        tenant_id:
          description: Tenant scope.
          format: uuid
          type: string
      required:
      - parent_id
      - tenant_id
      type: object
    HierarchyWithDepthDto:
      description: REST DTO for hierarchy context with depth in group responses.
      properties:
        depth:
          description: Relative distance from reference group.
          format: int32
          type: integer
        parent_id:
          description: Parent group ID (null for root groups).
          format: uuid
          type:
          - string
          - 'null'
        tenant_id:
          description: Tenant scope.
          format: uuid
          type: string
      required:
      - parent_id
      - tenant_id
      - depth
      type: object
    MembershipDto:
      description: |-
        REST DTO for membership representation.

        Membership responses do NOT include `tenant_id` (derived from group).
      properties:
        group_id:
          description: Group identifier.
          format: uuid
          type: string
        resource_id:
          description: Resource identifier.
          type: string
        resource_type:
          description: GTS type path of the resource type.
          type: string
      required:
      - group_id
      - resource_type
      - resource_id
      type: object
    MoveGroupDto:
      additionalProperties: false
      description: |-
        REST DTO for the group move operation
        (`POST /groups/{group_id}/move`).

        `parent_id` is **mandatory**, and an explicit `null` is its most important
        value: `null` means "make this group a root", an omitted key means the
        caller did not say where to move the group and is a 400. Collapsing those
        two into one value is the defect this operation was split out to remove,
        so the distinction is enforced here rather than assumed.
      properties:
        parent_id:
          description: |-
            New parent group ID, or `null` to move the group to the forest root.
            The key itself must be present.
          format: uuid
          type:
          - string
          - 'null'
      required:
      - parent_id
      type: object
    PageInfo:
      properties:
        limit:
          format: int64
          minimum: 0
          type: integer
        next_cursor:
          type:
          - string
          - 'null'
        prev_cursor:
          type:
          - string
          - 'null'
      required:
      - limit
      type: object
    Page_GroupDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/GroupDto'
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page_info
      type: object
    Page_GroupWithDepthDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/GroupWithDepthDto'
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page_info
      type: object
    Page_MembershipDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/MembershipDto'
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page_info
      type: object
    Page_TypeDto:
      properties:
        items:
          items:
            $ref: '#/components/schemas/TypeDto'
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
      required:
      - items
      - page_info
      type: object
    Problem:
      description: RFC 9457 problem+json. `context` varies by error category.
      properties:
        context:
          type: object
        detail:
          type: string
        instance:
          type: string
        status:
          format: int32
          type: integer
        title:
          type: string
        trace_id:
          type: string
        type:
          type: string
      required:
      - type
      - title
      - status
      - detail
      - context
      type: object
    TypeDto:
      description: REST DTO for GTS type representation.
      properties:
        allowed_membership_types:
          description: GTS type paths of allowed membership resource types
          items:
            type: string
          type: array
        allowed_parent_types:
          description: GTS type paths of allowed parent types
          items:
            type: string
          type: array
        can_be_root:
          description: Whether groups of this type can be root nodes
          type: boolean
        code:
          description: GTS type path
          type: string
        metadata_schema:
          description: Optional JSON Schema for instance metadata
      required:
      - code
      - can_be_root
      - allowed_parent_types
      - allowed_membership_types
      type: object
    UpdateGroupDto:
      additionalProperties: false
      description: |-
        REST DTO for updating a resource group's ordinary attributes (full
        replacement via PUT).

        **The group's GTS type is immutable after creation.** The payload
        deliberately does not carry a `type` field — to change a group's type,
        delete the existing group and create a new one. See the SDK
        `UpdateGroupRequest` doc for the full rationale.

        **The group's parent is not here either.** Re-parenting is a structural
        mutation — cycle detection, depth/width invariants, closure-table rebuild —
        so it has its own operation: `POST /groups/{group_id}/move` with
        [`MoveGroupDto`]. What is left on this resource is `name` and `metadata`,
        two ordinary fields, and this payload replaces both.

        Both fields are **required**. An omitted key is a 400, not "preserve the
        previous value": for `metadata` the two are genuinely indistinguishable to
        serde, and treating an omission as `null` is what used to erase stored
        metadata. Send `"metadata": null` to clear it deliberately.

        `deny_unknown_fields` locks the wire envelope, so a client that tries to
        change the immutable `type`, or that still sends `parent_id` expecting the
        pre-split move-via-PUT behaviour, gets an explicit 400 instead of a
        silently-discarded mutation.
      properties:
        metadata:
          description: 'Type-specific metadata. Required: send `null` to clear it.'
        name:
          description: Display name (1..255 characters). Required.
          type: string
      required:
      - name
      - metadata
      type: object
    UpdateTypeDto:
      additionalProperties: false
      description: |-
        REST DTO for updating a GTS type (full replacement via PUT).

        The type registry is a document resource: a type definition is replaced as
        a whole, so strict full replacement is the correct shape for it (baseline
        rule B1.1). Every replaceable field is therefore **required** and an
        omitted key is an error, not "preserve previous value" — `metadata_schema`
        must be sent explicitly as `null` to clear it.

        `deny_unknown_fields` locks the wire envelope, so a client that sends
        `code` (the type's identity, taken from the path and immutable) gets an
        explicit 400 instead of a silently-dropped field.
      properties:
        allowed_membership_types:
          description: GTS type paths of allowed membership resource types.
          items:
            type: string
          type: array
        allowed_parent_types:
          description: GTS type paths of allowed parent types.
          items:
            type: string
          type: array
        can_be_root:
          description: Whether groups of this type can be root nodes.
          type: boolean
        metadata_schema:
          description: |-
            JSON Schema for instance metadata. Required: send `null` to clear it.
            An omitted key is rejected — it used to silently erase the stored
            schema (`type_service.rs` writes the column unconditionally).
      required:
      - can_be_root
      - allowed_parent_types
      - allowed_membership_types
      - metadata_schema
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
